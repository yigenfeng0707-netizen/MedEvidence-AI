name: MedEvidence-AI Health Check

on:
  schedule:
    # 每天北京时间 09:00 运行（UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run health monitor
      run: python monitor.py
      env:
        MODELSCOPE_COOKIE: ${{ secrets.MODELSCOPE_COOKIE }}
